services:
  subtitle-tracks:
    build: .
    image: subtitle-track-api:latest
    container_name: subtitle-track-api
    ports:
      - "8080:8080"
    environment:
      # 容器内数据库文件路径（与 Dockerfile 的默认值一致）
      SCENES_DB_PATH: /data/scenes.db
    volumes:
      # 具名卷持久化 SQLite 场景数据；容器重启甚至重新创建后仍可读取场景
      - scenes-data:/data
    restart: unless-stopped

volumes:
  scenes-data:
